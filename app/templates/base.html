<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Malveon Leads{% endblock %}</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#272e38;--fg:#e6edf3;--dim:#8b949e;
      --hot:#f85149;--warm:#d29922;--cold:#3d444d;--acc:#58a6ff;--ok:#3fb950}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.sticky-top{position:sticky;top:0;z-index:9;background:var(--bg)}
header{display:flex;gap:18px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .brand{font-weight:700;letter-spacing:.3px}
header nav a{color:var(--dim);font-size:13px}header nav a.on{color:var(--fg)}
main{padding:20px;max-width:1400px;margin:0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;background:var(--bg);
  max-width:1400px;margin:0 auto;padding:14px 20px;border-bottom:1px solid var(--line)}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:99px;color:var(--dim);font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line)}
/* --toolbar-h is measured in JS from the real sticky header+filters height,
   so the column headers stick right below them at any window width instead
   of a guessed pixel offset that breaks the moment either row wraps. */
.sticky-th th{position:sticky;top:var(--toolbar-h, 60px);background:var(--bg);z-index:7}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#11161d}
.score{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.hot{color:var(--hot)}.warm{color:var(--warm)}.cold{color:var(--dim)}
.bars{font-size:11px;color:var(--dim);white-space:nowrap}
.why{color:var(--dim);font-size:13px;max-width:560px}
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:4px;font-size:11px;color:var(--dim);margin-right:4px}
.tag.company{border-color:#1f6feb;color:#79c0ff}.tag.intent{border-color:#238636;color:#56d364}
.tag.cold{border-color:#484f58}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
input,select,button{background:#0d1117;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--acc)}
.btn{background:var(--acc);color:#04121f;border:none;font-weight:600}
.stat{display:inline-block;margin-right:18px;color:var(--dim);font-size:12px}
.stat b{color:var(--fg);font-size:15px;display:block;font-variant-numeric:tabular-nums}
.sig{border-left:2px solid var(--line);padding:4px 0 4px 12px;margin-bottom:8px}
.sig .pts{color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--dim);font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--hot)}.warm{color:var(--warm)}
form.inline{display:inline}
h2,h3{font-weight:600}
h3{font-size:15px}
/* Progressive disclosure via <details>: no JS, no build step, and it keeps
   the explanation next to the thing it explains instead of in a manual. */
details.help{margin:0 0 14px}
details.help>summary{cursor:pointer;color:var(--dim);font-size:13px;list-style:none;
  display:inline-flex;align-items:center;gap:6px;padding:4px 0}
details.help>summary::-webkit-details-marker{display:none}
details.help>summary::before{content:"?";display:inline-flex;align-items:center;
  justify-content:center;width:16px;height:16px;border:1px solid var(--line);
  border-radius:99px;font-size:11px;line-height:1}
details.help>summary:hover{color:var(--fg)}
details.help[open]>summary{color:var(--fg);margin-bottom:8px}
details.help .body{color:var(--dim);font-size:13px;line-height:1.6;
  border-left:2px solid var(--line);padding:2px 0 2px 12px;max-width:70ch}
details.help .body b{color:var(--fg);font-weight:600}
/* A dotted underline marks a term that explains itself on hover. */
abbr[title]{text-decoration:underline dotted var(--line);text-underline-offset:3px;cursor:help}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
  border:1px solid var(--line);color:var(--dim)}
.pill.ok{border-color:#2ea04326;background:#2ea04314;color:var(--ok)}
.pill.warm{border-color:#d2992226;background:#d2992214;color:var(--warm)}
.pill.bad{border-color:#f8514926;background:#f8514914;color:var(--hot)}
</style></head><body>
<div class="sticky-top">
<header>
  <span class="brand">◆ Malveon Leads</span>
  <nav style="display:flex;gap:14px">
    <a href="/" class="{{ 'on' if request.url.path=='/' }}">Who to contact</a>
    <a href="/feed" class="{{ 'on' if request.url.path=='/feed' }}">What people are saying</a>
    <a href="/pain-points" class="{{ 'on' if request.url.path=='/pain-points' }}">Pain points</a>
    <a href="/visits" class="{{ 'on' if request.url.path=='/visits' }}">Who visited your site</a>
    <a href="/ops" class="{{ 'on' if request.url.path=='/ops' }}">System status</a>
  </nav>
  <form action="/add" method="post" class="inline" style="margin-left:auto">
    <input name="domain" placeholder="add a company…" style="width:180px">
  </form>
</header>
{% block toolbar %}{% endblock %}
</div>
<main>{% block body %}{% endblock %}</main>
<script>
(function () {
  var el = document.querySelector(".sticky-top");
  function set() { if (el) document.documentElement.style.setProperty("--toolbar-h", el.offsetHeight + "px"); }
  set();
  window.addEventListener("resize", set);
})();
</script>
</body></html>
